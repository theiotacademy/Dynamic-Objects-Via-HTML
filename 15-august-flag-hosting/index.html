<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>15 August - Flag Hoisting</title>
<style>
  * { margin:0; padding:0; }
  body { background:#000; overflow:hidden; position:relative; }
  canvas { display:block; }
  #flag-gif {
    position: fixed;
    display: none;
    image-rendering: auto;
    transform-origin: left center;
    z-index: 5;
    transition: none;
    mix-blend-mode: screen;
    filter: saturate(4) brightness(0.85) contrast(1.6);
  }
  #hint {
    position:fixed; bottom:28px; left:50%;
    transform:translateX(-50%);
    color:#fff; font-size:1rem;
    font-family:Georgia,serif;
    background:rgba(0,0,0,0.5);
    padding:6px 18px; border-radius:20px;
    pointer-events:none;
    animation:blink 1.4s ease-in-out infinite;
  }
  @keyframes msgSlideUp {
    from { opacity:0; transform:translateY(50px) scale(0.9); }
    to   { opacity:1; transform:translateY(0)    scale(1);   }
  }
  @keyframes shimmer {
    0%   { background-position: -300% center; }
    100% { background-position:  300% center; }
  }
  @keyframes glowPulse {
    0%,100% { text-shadow: 0 0 8px #b8860b, 0 2px 4px rgba(0,0,0,0.9); }
    50%     { text-shadow: 0 0 20px #d4a017, 0 2px 8px rgba(0,0,0,0.9); }
  }
  @keyframes dividerGlow {
    0%,100% { opacity:0.6; transform:scaleX(0.94); }
    50%     { opacity:1;   transform:scaleX(1);    }
  }
  #independence-msg {
    position: fixed;
    bottom: 190px;
    right: 40px;
    text-align: right;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(180,120,0,0.5);
    border-radius: 14px;
    padding: 18px 28px;
    backdrop-filter: blur(8px);
  }
  #independence-msg.show {
    animation: msgSlideUp 1s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  #independence-msg .line1 {
    font-family: Georgia, serif;
    font-size: 1.3rem;
    color: #c8960c;
    letter-spacing: 4px;
    text-transform: uppercase;
    animation: glowPulse 2.5s ease-in-out infinite;
  }
  #independence-msg .line2 {
    font-family: Georgia, serif;
    font-size: 3.2rem;
    font-weight: bold;
    background: linear-gradient(90deg, #7a3300, #cc5500, #ff9933, #e8c000, #ffffff, #0d6b0d, #138808, #cc5500, #7a3300);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s linear infinite;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.95));
    line-height: 1.15;
  }
  #independence-msg .line3 {
    font-family: Georgia, serif;
    font-size: 1.2rem;
    color: #cccccc;
    letter-spacing: 2px;
    margin-top: 4px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.95);
  }
  #independence-msg .divider {
    width: 100%;
    height: 2.5px;
    background: linear-gradient(90deg, transparent, #7a3300, #cc5500, #ff9933, #cccccc, #138808, #0d6b0d, transparent);
    margin: 8px 0;
    border-radius: 2px;
    animation: dividerGlow 2.2s ease-in-out infinite;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="flag-gif" src="flag.mp4" autoplay loop muted playsinline></video>
<div id="independence-msg">
  <div class="line1">Celebrating</div>
  <div class="divider"></div>
  <div class="line2">Happy 80th<br>Independence Day</div>
  <div class="divider"></div>
  <div class="line3">15 August 2026 &nbsp;•&nbsp; Jai Hind</div>
</div>
<div id="hint">🪢 Click anywhere to hoist the flag</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── State ──────────────────────────────────────────────
let hoisted     = false;
let flagY       = 0;      // 0 = bottom, 1 = top
let unfurl      = 0;      // 0→1
let t           = 0;
let petalList   = [];
let spawnCount  = 0;
let fireworks   = [];
let ropeShake   = 0;      // rope pull shake amount
let flashAlpha  = 0;      // white flash on click

// Pole geometry (computed each frame from W,H)
function poleX()      { return W * 0.5; }
function poleBottom() { return H * 0.82; }
function poleTop()    { return H * 0.08; }
function poleH()      { return poleBottom() - poleTop(); }
function flagAttachY(){ return poleTop() + (1 - flagY) * poleH(); }

// ── Input ──────────────────────────────────────────────
canvas.addEventListener('click', e => {
  if (hoisted) return;
  hoistFlag();
});

function hoistFlag() {
  hoisted    = true;
  ropeShake  = 1;
  flashAlpha = 0.35;
  document.getElementById('hint').style.display = 'none';
}

// ── Background ─────────────────────────────────────────
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.78);
  g.addColorStop(0,    '#0a2a6e');
  g.addColorStop(0.35, '#1565c0');
  g.addColorStop(0.7,  '#42a5f5');
  g.addColorStop(1,    '#b3e5fc');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H * 0.78);
}

function drawSun() {
  const sx = W * 0.78, sy = H * 0.13, sr = H * 0.055;
  // Glow
  const glow = ctx.createRadialGradient(sx,sy,sr*0.4, sx,sy,sr*2.8);
  glow.addColorStop(0,   'rgba(255,240,100,0.55)');
  glow.addColorStop(0.5, 'rgba(255,200,50,0.18)');
  glow.addColorStop(1,   'rgba(255,180,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(sx,sy,sr*2.8,0,Math.PI*2); ctx.fill();
  // Sun disc
  const disc = ctx.createRadialGradient(sx-sr*0.2,sy-sr*0.2,sr*0.1, sx,sy,sr);
  disc.addColorStop(0, '#fffde7');
  disc.addColorStop(0.6,'#ffe082');
  disc.addColorStop(1,  '#ffb300');
  ctx.fillStyle = disc;
  ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();
}

function drawCloud(x, y, s) {
  ctx.save();
  ctx.shadowColor = 'rgba(180,210,255,0.4)';
  ctx.shadowBlur  = 18;
  const g = ctx.createRadialGradient(x,y,s*0.1, x,y,s*1.6);
  g.addColorStop(0,   'rgba(255,255,255,0.97)');
  g.addColorStop(0.6, 'rgba(240,248,255,0.85)');
  g.addColorStop(1,   'rgba(200,230,255,0)');
  ctx.fillStyle = g;
  const blobs = [[0,0,1],[s*0.7,-s*0.3,0.75],[s*1.3,0,0.85],[-s*0.6,-s*0.2,0.65],[s*2,s*0.1,0.6]];
  blobs.forEach(([bx,by,bs]) => {
    ctx.beginPath();
    ctx.arc(x+bx, y+by, s*bs, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.restore();
}

function drawGround() {
  // Main ground
  const g = ctx.createLinearGradient(0, H*0.78, 0, H);
  g.addColorStop(0,   '#2e7d32');
  g.addColorStop(0.12,'#388e3c');
  g.addColorStop(0.5, '#1b5e20');
  g.addColorStop(1,   '#0a2e0a');
  ctx.fillStyle = g;
  ctx.fillRect(0, H*0.78, W, H*0.22);

  // Grass blades
  for (let i = 0; i < W; i += 5) {
    const h  = 8 + Math.sin(i*0.3 + t*0.8)*3 + Math.random()*6;
    const lean = Math.sin(t*0.6 + i*0.05)*2;
    ctx.strokeStyle = `hsl(${110+Math.random()*20},${55+Math.random()*20}%,${28+Math.random()*14}%)`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(i, H*0.78);
    ctx.quadraticCurveTo(i + lean, H*0.78 - h*0.6, i + lean*1.5, H*0.78 - h);
    ctx.stroke();
  }

  // Ground shadow under pole
  const sh = ctx.createRadialGradient(poleX(), H*0.82, 2, poleX(), H*0.82, 60);
  sh.addColorStop(0,   'rgba(0,0,0,0.35)');
  sh.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = sh;
  ctx.beginPath();
  ctx.ellipse(poleX(), H*0.83, 55, 14, 0, 0, Math.PI*2);
  ctx.fill();
}

// ── Pole ───────────────────────────────────────────────
function drawPole() {
  const px = poleX(), pb = poleBottom(), pt = poleTop();

  // Pole shadow
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.moveTo(px+6, pb);
  ctx.lineTo(px+22, pb);
  ctx.lineTo(px+14, pt);
  ctx.lineTo(px+6, pt);
  ctx.fill();
  ctx.restore();

  // Pole body
  const pg = ctx.createLinearGradient(px-6, 0, px+6, 0);
  pg.addColorStop(0,    '#9e9e9e');
  pg.addColorStop(0.3,  '#f5f5f5');
  pg.addColorStop(0.65, '#e0e0e0');
  pg.addColorStop(1,    '#757575');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.roundRect(px-5, pt, 10, pb-pt, 3);
  ctx.fill();

  // Pole highlight
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(px-2, pt+10); ctx.lineTo(px-2, pb-10);
  ctx.stroke();

  // Golden ball
  const bx = px, by = pt - 14, br = 13;
  const bg = ctx.createRadialGradient(bx-4, by-4, 1, bx, by, br);
  bg.addColorStop(0,   '#fff9c4');
  bg.addColorStop(0.3, '#ffd54f');
  bg.addColorStop(0.7, '#ff8f00');
  bg.addColorStop(1,   '#e65100');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

// ── Rope ───────────────────────────────────────────────
function drawRope() {
  const rx = poleX() + 16;
  const rb = poleBottom();
  const rt = poleTop() - 2;

  // Rope shadow
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(rx+2, rb); ctx.lineTo(rx+2, rt); ctx.stroke();
  ctx.restore();

  // Twisted rope with shake on click
  const segments = 60;
  const segH = (rb - rt) / segments;
  for (let i = 0; i < segments; i++) {
    const y1 = rb - i * segH;
    const y2 = rb - (i+1) * segH;
    const shake = ropeShake * Math.sin(i * 0.5 + t * 20) * 4;
    const twist = Math.sin(i * 0.55) * 1.5 + shake;
    const c = (i % 2 === 0) ? '#c8a96e' : '#7a5c1e';
    ctx.strokeStyle = c;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(rx + twist, y1);
    ctx.lineTo(rx - twist, y2);
    ctx.stroke();
  }

  // Rope highlight
  ctx.strokeStyle = 'rgba(255,240,180,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(rx-1, rb); ctx.lineTo(rx-1, rt); ctx.stroke();
}

// ── Flag GIF (positioned over canvas) ───────────────────
const flagGif = document.getElementById('flag-gif');

function updateFlagGifPosition() {
  if (unfurl <= 0.01) { flagGif.style.display = 'none'; return; }

  const px = poleX();
  const FW = Math.min(W * 0.28, 260);
  const FH = Math.round(FW * (2 / 3));

  // Flag top must never go above poleTop()
  const rawFy = flagAttachY();
  const fy    = Math.max(poleTop(), rawFy);

  flagGif.style.display        = 'block';
  flagGif.style.left           = px + 'px';
  flagGif.style.top            = fy + 'px';
  flagGif.style.width          = (FW * unfurl) + 'px';
  flagGif.style.height         = FH + 'px';
  flagGif.style.objectFit      = 'cover';
  flagGif.style.objectPosition = 'left center';
}

function drawFlag() { /* handled by updateFlagGifPosition */ }

// ── Fireworks ──────────────────────────────────────────
const FW_COLORS = ['#FF9933','#ffffff','#138808','#ffd700','#ff4466','#44aaff','#ff88ff'];
let fwLaunched = false;

function launchFireworks() {
  fwLaunched = true;
  for (let b = 0; b < 7; b++) {
    setTimeout(() => {
      const x = W * (0.15 + Math.random() * 0.7);
      const y = H * (0.06 + Math.random() * 0.28);
      const color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
      const particles = [];
      for (let i = 0; i < 52; i++) {
        const angle = (i / 52) * Math.PI * 2;
        const speed = 2 + Math.random() * 4;
        particles.push({ x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1, color, trail: []
        });
      }
      fireworks.push({ particles });
    }, b * 300);
  }
}

function drawFireworks() {
  ctx.save();
  fireworks.forEach(fw => {
    fw.particles.forEach(p => {
      if (p.alpha <= 0) return;
      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > 6) p.trail.shift();
      p.trail.forEach((tp, i) => {
        ctx.beginPath();
        ctx.arc(tp.x, tp.y, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha * (i / p.trail.length) * 0.35;
        ctx.fill();
      });
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha;
      ctx.fill();
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.055;
      p.vx *= 0.97; p.vy *= 0.97;
      p.alpha -= 0.016;
    });
  });
  fireworks = fireworks.filter(fw => fw.particles.some(p => p.alpha > 0));
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ── Petals ─────────────────────────────────────────────
const PETAL_COLORS = [
  ['#ffcdd2','#e53935'],  // red rose
  ['#f8bbd0','#e91e63'],  // pink rose
  ['#fff9c4','#f9a825'],  // marigold
  ['#ffe0b2','#ef6c00'],  // orange marigold
  ['#f3e5f5','#8e24aa'],  // lavender
  ['#ffffff','#bdbdbd'],  // white
];

function makePetal() {
  const fc = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
  const fx = poleX(), fy = flagAttachY();
  const FW = Math.min(W * 0.22, 200);
  return {
    x:  fx + Math.random() * FW,
    y:  fy + Math.random() * 30,
    vx: (Math.random() - 0.5) * 2.5,
    vy: 0.5 + Math.random() * 1.5,
    rot:  Math.random() * Math.PI * 2,
    rotV: (Math.random() - 0.5) * 0.07,
    w:  9 + Math.random() * 9,
    h:  5 + Math.random() * 5,
    c1: fc[0], c2: fc[1],
    alpha: 1,
    wobble: Math.random() * Math.PI * 2,
    wS: 0.025 + Math.random() * 0.025,
    tilt: (Math.random() - 0.5) * 0.6,
  };
}

function drawPetal(p) {
  ctx.save();
  ctx.globalAlpha = p.alpha;
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  ctx.scale(1, Math.abs(Math.cos(p.tilt)) * 0.5 + 0.5); // 3D flip

  const g = ctx.createRadialGradient(0, -p.h*0.3, p.h*0.1, 0, 0, p.w);
  g.addColorStop(0,   p.c1);
  g.addColorStop(0.6, p.c2);
  g.addColorStop(1,   shadeColor(p.c2, -30));
  ctx.fillStyle = g;

  ctx.beginPath();
  ctx.moveTo(0, -p.h);
  ctx.bezierCurveTo( p.w*0.9, -p.h*0.6,  p.w,  p.h*0.4,  0,  p.h);
  ctx.bezierCurveTo(-p.w,     p.h*0.4, -p.w*0.9, -p.h*0.6,  0, -p.h);
  ctx.fill();

  // Midrib
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 0.7;
  ctx.beginPath();
  ctx.moveTo(0, -p.h*0.75); ctx.lineTo(0, p.h*0.75);
  ctx.stroke();

  ctx.restore();
}

function shadeColor(hex, amt) {
  let r = parseInt(hex.slice(1,3),16)+amt;
  let g = parseInt(hex.slice(3,5),16)+amt;
  let b = parseInt(hex.slice(5,7),16)+amt;
  r = Math.max(0,Math.min(255,r));
  g = Math.max(0,Math.min(255,g));
  b = Math.max(0,Math.min(255,b));
  return `rgb(${r},${g},${b})`;
}

function updatePetals() {
  petalList.forEach(p => {
    p.wobble += p.wS;
    p.vx += Math.sin(p.wobble) * 0.07;
    p.vy += 0.018;
    p.x  += p.vx;
    p.y  += p.vy;
    p.rot  += p.rotV;
    p.tilt += 0.03;
    if (p.y > H * 0.78) p.alpha -= 0.022;
    drawPetal(p);
  });
  petalList = petalList.filter(p => p.alpha > 0.02);
}

// ── Main Loop ──────────────────────────────────────────
let lastSpawn = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  t = ts * 0.001;

  ctx.clearRect(0, 0, W, H);

  drawSky();
  drawSun();
  drawCloud(W*0.1,  H*0.09, H*0.045);
  drawCloud(W*0.42, H*0.06, H*0.038);
  drawCloud(W*0.72, H*0.11, H*0.052);
  drawCloud(W*0.88, H*0.05, H*0.03);
  drawGround();
  drawPole();
  drawRope();
  updateFlagGifPosition();
  updatePetals();

  // Rope shake decay
  ropeShake *= 0.88;

  // White flash decay
  if (flashAlpha > 0) {
    flashAlpha -= 0.018;
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0,flashAlpha)})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Hoist — fast rise
  if (hoisted && flagY < 1) {
    flagY = Math.min(1, flagY + 0.016);
  }
  // Unfurl immediately once near top
  if (flagY > 0.92 && unfurl < 1) {
    unfurl = Math.min(1, unfurl + 0.032);
  }
  // Spawn petals
  if (unfurl > 0.5 && spawnCount < 260) {
    if (ts - lastSpawn > 60) {
      petalList.push(makePetal());
      petalList.push(makePetal());
      petalList.push(makePetal());
      spawnCount += 3;
      lastSpawn = ts;
    }
  }
  // Show independence message when flag fully hoisted
  if (unfurl >= 1 && !fwLaunched) {
    launchFireworks();
    setTimeout(() => {
      document.getElementById('independence-msg').classList.add('show');
    }, 600);
  }
  drawFireworks();
}

requestAnimationFrame(loop);
</script>
</body>
</html>
