<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Teachers Day | The guidance of a Teacher will be carried lifelong</title>
  <meta name="description" content="A Happy Teachers Day greeting page built with HTML, CSS and JavaScript." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <main class="poster" id="poster">
    <div class="art">
      <img src="assets/raw-img.png" id="plantImg" alt="Silhouette of a graduate with a plant being watered and a handshake" />
      <div class="tree-overlay hidden" id="treeOverlay">
        <img src="assets/tree.png" alt="Tree overlay" />
      </div>
    </div>

    <div class="content">
      <p class="quote" id="quote">The guidance of a Teacher will be carried lifelong</p>
      <h1 class="title">Happy Teachers Day</h1>
      <p class="sub">5<sup>th</sup> September</p>

      <form class="wish-form" id="wishForm">
        <input type="text" id="nameInput" placeholder="Enter your teacher's name" autocomplete="off" />
        <button type="submit">Send Wish</button>
      </form>

      <p class="message" id="message"></p>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>

</html>
